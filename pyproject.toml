[project]
name = "tutuptutupi"
version = "0.1.0"
description = "interactive cli that masks tabular data while keeping its shape"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "questionary>=2", "rich>=13", "openpyxl", "xlrd", "pyarrow", "textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyinstaller"]

[project.scripts]
tutuptutupi = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "cli", "core", "detect", "editor", "fileio", "i18n", "maskers"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
